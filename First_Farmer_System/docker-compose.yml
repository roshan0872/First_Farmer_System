version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: first_farmer_mysql
    restart: always
    environment:
      MYSQL_DATABASE: first_farmer_db
      MYSQL_USER: firstfarmer_user
      MYSQL_PASSWORD: securepassword123
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: first_farmer_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://firstfarmer_user:securepassword123@db:3306/first_farmer_db
      SECRET_KEY: docker_compose_production_secret_key_change_me
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
